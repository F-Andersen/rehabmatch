services:
  postgres:
    image: postgres:16-alpine
    container_name: rehabmatch-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rehabmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-rehabmatch}
    volumes:
      - rehabmatch_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rehabmatch} -d ${POSTGRES_DB:-rehabmatch}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rehabmatch_pg_data:
